<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudflareSpeedTest 结果</title>
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --fg: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --accent: #f38020;
    --row-hover: #fef3e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --border: #27272a;
      --row-hover: #2d1c0a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 4rem;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .title { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
  .stamp { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 0.625rem; font-size: 0.8125rem; }
  .actions a {
    color: var(--muted); text-decoration: none;
    padding: 0.375rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: color 0.15s, border-color 0.15s;
  }
  .actions a:hover { color: var(--accent); border-color: var(--accent); }
  .stats { display: flex; gap: 2.25rem; margin-bottom: 1.5rem; }
  .stat { display: flex; flex-direction: column; }
  .stat-num {
    font-size: 1.625rem; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .stat-num.accent { color: var(--accent); }
  .stat-label {
    font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-top: 0.25rem;
  }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: auto;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td {
    padding: 0.625rem 1rem; text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; font-size: 0.875rem;
  }
  tbody tr:last-child td { border-bottom: 0; }
  th {
    font-weight: 600; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted);
    cursor: pointer; user-select: none;
    background: var(--surface);
    position: sticky; top: 0;
  }
  th:hover { color: var(--fg); }
  th.sorted { color: var(--accent); }
  tr.row { cursor: pointer; transition: background 0.1s; }
  tr.row:hover td { background: var(--row-hover); }
  td.num { text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  td.ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; }
  td.speed { color: var(--accent); font-weight: 700; }
  .toast {
    position: fixed; bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(2rem);
    background: var(--fg); color: var(--bg);
    padding: 0.625rem 1.25rem; border-radius: 8px;
    font-size: 0.875rem;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty { padding: 4rem 1rem; text-align: center; color: var(--muted); }
  footer { margin-top: 2.5rem; text-align: center; color: var(--muted); font-size: 0.75rem; }
  footer a { color: inherit; }
  @media (max-width: 640px) {
    body { padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.25rem; }
    .stat-num { font-size: 1.25rem; }
    th, td { padding: 0.5rem 0.625rem; font-size: 0.8125rem; }
    .stats { gap: 1.25rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>CloudflareSpeedTest</h1>
      <span class="stamp" id="when">—</span>
    </div>
    <div class="actions">
      <a href="result.csv" download>下载 CSV</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><span class="stat-num" id="stat-count">—</span><span class="stat-label">IP 数</span></div>
    <div class="stat"><span class="stat-num accent" id="stat-top-speed">—</span><span class="stat-label">最高速度 MB/s</span></div>
    <div class="stat"><span class="stat-num" id="stat-top-delay">—</span><span class="stat-label">最低延迟 ms</span></div>
  </div>

  <div class="table-wrap" id="table-host">
    <div class="empty">加载中...</div>
  </div>

  <footer>点击行可复制 IP</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const NUM_COLS = new Set([1, 2, 3, 4, 5, 6]);
const SPEED_COL = 6;
const DELAY_COL = 5;
const TIME_COL = 8;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[c]);

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

fetch('result.csv?_=' + Date.now(), { cache: 'no-store' })
  .then((r) => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then((text) => {
    const lines = text.trim().split('\n');
    if (lines.length <= 1) {
      document.getElementById('table-host').innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    const headers = lines[0].split(',');
    const rows = lines.slice(1).map((l) => l.split(','));

    document.getElementById('stat-count').textContent = rows.length;
    const speeds = rows.map((r) => parseFloat(r[SPEED_COL])).filter((n) => !isNaN(n));
    const delays = rows.map((r) => parseFloat(r[DELAY_COL])).filter((n) => !isNaN(n));
    document.getElementById('stat-top-speed').textContent = speeds.length ? Math.max(...speeds).toFixed(2) : '—';
    document.getElementById('stat-top-delay').textContent = delays.length ? Math.min(...delays).toFixed(2) : '—';
    document.getElementById('when').textContent = rows[0][TIME_COL] || '';

    let sortIdx = SPEED_COL;
    let sortDir = -1;
    const host = document.getElementById('table-host');

    const render = () => {
      const sorted = [...rows].sort((a, b) => {
        const va = a[sortIdx] ?? '';
        const vb = b[sortIdx] ?? '';
        if (NUM_COLS.has(sortIdx)) {
          return ((parseFloat(va) || 0) - (parseFloat(vb) || 0)) * sortDir;
        }
        return va.localeCompare(vb) * sortDir;
      });
      const ths = headers.map((h, i) => {
        const isSorted = i === sortIdx;
        const arrow = isSorted ? (sortDir === 1 ? ' ↑' : ' ↓') : '';
        return '<th data-i="' + i + '" class="' + (isSorted ? 'sorted' : '') + '">' + esc(h) + arrow + '</th>';
      }).join('');
      const trs = sorted.map((row) => {
        const tds = row.map((v, i) => {
          let cls = '';
          if (i === 0) cls = 'ip';
          else if (i === SPEED_COL) cls = 'num speed';
          else if (NUM_COLS.has(i)) cls = 'num';
          return '<td class="' + cls + '">' + esc(v) + '</td>';
        }).join('');
        return '<tr class="row" data-ip="' + esc(row[0]) + '">' + tds + '</tr>';
      }).join('');
      host.innerHTML = '<table><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table>';
      host.querySelectorAll('th').forEach((th) => {
        th.onclick = () => {
          const i = +th.dataset.i;
          if (sortIdx === i) sortDir = -sortDir;
          else { sortIdx = i; sortDir = NUM_COLS.has(i) ? -1 : 1; }
          render();
        };
      });
      host.querySelectorAll('tr.row').forEach((tr) => {
        tr.onclick = () => {
          const ip = tr.dataset.ip;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(ip).then(() => showToast('已复制 ' + ip));
          }
        };
      });
    };
    render();
  })
  .catch((err) => {
    document.getElementById('table-host').innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
  });
</script>
</body>
</html>
